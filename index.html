<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Folkstyle Wrestling Technique Tree</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1f2630;--text:#f0f6fc;--muted:#9da7b3;--accent:#58a6ff;--line:#30363d;--good:#7ee787}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 20px}
header h1{margin:0 0 6px;font-size:24px} header p{margin:0;color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 76px)}
nav{border-right:1px solid var(--line);padding:16px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;background:var(--panel)}
nav h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:5px;font-size:14px}
nav button:hover,nav button.active{background:var(--panel2);border-color:var(--line)}
.search-area{margin:0 0 16px;grid-column:1/-1}
.search-area label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
#tree-search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
#tree-search:focus{outline:2px solid var(--accent);outline-offset:1px}
#search-results{margin-top:8px}
#search-results:empty{display:none}
#search-results button{display:block;margin:0 0 5px;width:100%;background:var(--panel2);border-color:var(--line)}
#search-results small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-status{color:var(--muted);font-size:12px;margin:5px 0 8px}
main{padding:24px;max-width:1200px;width:100%}
.section{display:none;scroll-margin-top:88px}.section.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.16)}
.section h2{margin:0 0 8px;font-size:28px}.section .sub{color:var(--muted);margin-bottom:18px}
.tree{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;white-space:normal;line-height:1.5;background:#0b0f14;border:1px solid var(--line);border-radius:12px;padding:18px;overflow:auto}.tree-line{display:flex;align-items:flex-start;min-height:1.5em}.tree-prefix{flex:0 0 auto;white-space:pre}.tree-text{flex:1 1 auto;min-width:0;white-space:normal;overflow-wrap:anywhere}
.links{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.links a{display:inline-block;margin:4px 8px 4px 0;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
.badge{display:inline-block;font-size:12px;padding:3px 7px;border-radius:999px;background:#17314f;color:#b9dcff;margin-left:8px;vertical-align:middle}
.coach{margin-top:14px;padding:12px 14px;border-left:3px solid var(--good);background:#101820;color:#d9e8df;border-radius:8px}
#top-button{position:fixed;right:22px;bottom:54px;z-index:10;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--text);padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#collapse-button{position:fixed;right:22px;bottom:104px;z-index:10;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--text);width:42px;height:42px;font:inherit;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#collapse-button:hover{border-color:var(--accent);background:var(--panel)}
#top-button:hover{border-color:var(--accent);background:var(--panel)}
#current-selection{display:none}

.nav-group{margin:4px 0 12px;border:1px solid var(--line);border-radius:10px;background:#111821;overflow:hidden}
.nav-group>button{margin:0;border:0;border-radius:0;font-weight:700;font-size:17px;padding:11px 10px}
.nav-group>button::after{content:'▸';float:right;color:var(--muted);transition:transform .18s ease}
.nav-group.open>button::after{transform:rotate(90deg)}
.nav-submenu{display:none;padding:5px 7px 7px;border-top:1px solid var(--line);background:var(--bg)}
.nav-group.open .nav-submenu{display:block}
.nav-submenu button{font-size:15px;padding:9px 8px;margin-bottom:4px}
.coach-focus-wrap{margin:5px 0 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.coach-focus-toggle{width:100%;margin:0!important;border:0!important;border-radius:0!important;padding:11px 10px!important;font-size:16px!important;font-weight:800!important;text-align:left}
.coach-focus-toggle::after{content:'▸';float:right;color:var(--muted);transition:transform .18s ease}
.coach-focus-wrap.open .coach-focus-toggle::after{transform:rotate(90deg)}
.coach-focus{display:none;padding:14px 13px 16px;font-size:16px;line-height:1.65;color:var(--muted);border-top:1px solid var(--line)}
.coach-focus-wrap.open .coach-focus{display:block}
.coach-focus strong{color:var(--text)}
.coach-focus .focus-title{color:var(--good);font-weight:800;font-size:18px;line-height:1.35;margin-bottom:10px}
.coach-focus .focus-order{color:var(--text);margin-bottom:11px}
.drill-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
.drill-table th,.drill-table td{padding:10px 11px;border:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.4}
.drill-table th{background:var(--panel2)}
.drill-table td:first-child{font-weight:650;width:25%}
.drill-table td:nth-child(2){width:40%}
.drill-note{margin:14px 0 0;padding:12px 14px;border-left:3px solid var(--accent);background:#101820;border-radius:8px;color:#d7e8fa}
.drill-kicker{color:var(--accent);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.curriculum-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.curriculum-stat{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px}
.curriculum-stat strong{display:block;font-size:18px;margin-bottom:3px}
.curriculum-stat span{font-size:12px;color:var(--muted)}
.core6-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.core6-item{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;line-height:1.4}
.core6-item strong{display:block;margin-bottom:4px}
.practice-card{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;margin:12px 0}
.practice-card h3{margin:0 0 6px;font-size:17px}
.practice-card .practice-focus{color:var(--accent);font-weight:700;margin-bottom:7px}
.practice-card p{margin:6px 0;line-height:1.45}
.practice-card .practice-live{color:var(--muted);font-size:13px}
.phase-badge{display:inline-block;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);margin-bottom:10px}
@media(max-width:800px){.curriculum-overview,.core6-grid{grid-template-columns:1fr}}
@media(max-width:800px){.nav-group{grid-column:1/-1}.nav-submenu{grid-template-columns:1fr 1fr}.drill-table{display:block;overflow-x:auto}.drill-table th,.drill-table td{min-width:160px}}

@media(max-width:800px){
  header{position:relative;top:auto}
  .layout{grid-template-columns:1fr}
  nav{position:relative;top:auto;z-index:auto;height:auto;overflow:visible;border-right:none;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr;gap:8px;box-shadow:none;padding:12px}
  .search-area{position:relative;top:auto;z-index:auto;background:var(--panel);padding:0;margin:0 0 8px}
  .nav-group{margin:0 0 8px}
  .nav-submenu{max-height:none;overflow:visible}
  #current-selection{display:none!important}
  main{padding:14px}
  .section{scroll-margin-top:16px}
  .section h2{font-size:23px}
}
</style>
</head>

</nav>
<div id="current-selection" aria-live="polite">Current: 1. Neutral — Root Position</div><main id="main"></main>

<script>
const sections = [
{n:1,title:'Neutral — Root Position',tree:`GOOD STANCE + HEAD POSITION + HAND FIGHTING
│
├── Head Position
├── Inside Position

├── Level Changes
├── Fakes
└── Footwork / Angle Creation

Opponent gives:
├── Head → Attack Head
├── Arm → Attack Arm
├── Leg → Attack Leg
└── Pressure → Redirect Pressure`,refs:[2,3,4,5,6,7,13,30]},
{n:2,title:'Collar-Tie',tree:`YOU ESTABLISH COLLAR TIE
│

│
├── Opponent Stays Upright

│       └── Front Headlock

│           ├── Severn
│           ├── Near Cradle
│           ├── Cow Catcher
│           └── Cement Mixer
│
├── Opponent Resists Snap / Comes Up

│       ├── Double Leg
│       ├── High Crotch
│       ├── Knee Pick

{n:3,title:'Clearing Collar Ties',tree:`OPPONENT ESTABLISHES COLLAR TIE
│
├── CLEAR 1 — ELBOW CONTROL → PASS ARM
│   ├── Control Opponent's Elbow
│   ├── Lower Your Head
│   ├── Pass Opponent's Arm Over Your Head
│   └── Arm Clears Past Head
│       └── IMMEDIATE LEG ATTACK
│           ├── Single Leg
│           ├── High Crotch
│           └── Double Leg
│
├── CLEAR 2 — ELBOW PUSH → POST → LEVEL CHANGE

└── CLEAR 3 — ELBOW + WRIST → BASEBALL-BAT 2-ON-1

├── Opponent Pulls Wrist Back

{n:6,title:'Russian 2-on-1',tree:`RUSSIAN / 2-ON-1
│
├── Opponent Stays Upright
│   ├── Knee Pick
│   └── Single Leg
│
├── Opponent Pulls Arm Back

│

│
├── Setup

├── Good Penetration

{n:9,title:'High-Crotch',tree:`HIGH CROTCH
│
├── Opponent Stays Upright
│   └── Come Up → Double Finish
│
├── Opponent Moves Leg Outside
│   └── Convert to Single
│
├── Opponent Squares Hips
│   └── Run Corner
│
└── Opponent Sprawls
    ├── Peak Out → Rear Position
    └── Crackdown
        ├── Shelf Leg
        ├── Cartwheel
        ├── Trap Arm and Roll to Back
        └── Head Hunt to Cradle`,refs:[8,10,14,15,21]},
{n:10,title:'Single-Leg',tree:`SINGLE LEG CAPTURED
│
├── Leg Stays Low
│   ├── Run Corner
│   ├── Shelf
│   └── Cover
│
├── Leg Comes Up
│   └── Shelf Leg
│       ├── Opponent Hops → Far Ankle → Finish

│
├── Opponent Whizzers
│   ├── Head Up

│       └── Roll Through
│
├── Opponent Pushes Head Down

│
└── Opponent Turns Hips Away
    └── Turk

{n:11,title:'Low-Single',tree:`LOW SINGLE
│
├── Secure Ankle / Heel
│
├── Opponent Falls Toward Hip
│   ├── Cover Hips
│   └── Shelf Leg
│
├── Opponent Turns Away
│   └── Turk
│
├── Opponent Stays Upright

│
└── Opponent Sprawls

{n:12,title:'Front-Headlock',tree:`FRONT HEADLOCK
├── Chin + Arm
└── Head in Hole
    │
    ├── Opponent Stays on Knees
    │   └── Circle Behind
    │
    ├── Opponent Blocks Go-Behind
    │   └── Severn
    │
    ├── Opponent Posts Hard
    │   └── Cow Catcher
    │       └── Opponent Resists → Cement Mixer
    │
    ├── Head and Knee Come Together
    │   └── Near Cradle
    │       ├── Lock

    │
    ├── Opponent Drives Into You

{n:13,title:'Neutral-Defense',badge:'Horning Up Included',tree:`OPPONENT ATTACKS / PENETRATES
│
├── FIRST LINE — HEAD
│   ├── Head / Shoulder Block
│   └── Maintain Head Position
│
├── SECOND LINE — HANDS / INSIDE FRAME
│   ├── Down Block
│   ├── Cross Block
│   └── HORN UP
│       ├── Bring Arm / Elbow Up Into Strong Inside Position

│           ├── Opponent Backs Out
│           │   └── Return to Stance → Reattack

│
├── Down Block Successful

DEFENSIVE PROGRESSION:

{n:14,title:'Opponent Has Your Leg',tree:`OPPONENT CAPTURES SINGLE
│

├── Opponent's Head Low

function updateSearch(){
  const query=searchInput.value.trim().toLocaleLowerCase();
  searchResults.replaceChildren();
  if(!query)return;
  const terms=query.split(/\s+/);

  const skillMatches=sections.map(s=>{
    const lines=s.tree.split('\n').map(line=>line.replace(/^[\s│├└─]+/g,'').trim()).filter(Boolean);
    const haystack=(s.title+' '+s.tree).toLocaleLowerCase();
    const titleHit=s.title.toLocaleLowerCase().includes(query);
    const matchingLines=lines.filter(line=>terms.every(term=>line.toLocaleLowerCase().includes(term)));
    const hit=terms.every(term=>haystack.includes(term));
    return {type:'skill',item:s,titleHit,matchingLines,hit};
  }).filter(m=>m.titleHit||m.hit);

  const drillMatches=drillLevels.map(level=>{
    const lines=level.rows.flatMap(r=>r).map(String);
    const haystack=(level.title+' '+lines.join(' ')+' '+(level.group||'')+' '+(level.note||'')).toLocaleLowerCase();
    const titleHit=(`Level ${level.n} ${level.title}`).toLocaleLowerCase().includes(query);
    const matchingLines=lines.filter(line=>terms.every(term=>line.toLocaleLowerCase().includes(term)));
    const hit=terms.every(term=>haystack.includes(term));
    return {type:'drill',item:level,titleHit,matchingLines,hit};
  }).filter(m=>m.titleHit||m.hit);

  const curriculumMatches=curriculumWeeks.map(week=>{
    const lines=[week.phase,week.focus,...week.p.flatMap(p=>p)].map(String);
    const haystack=('Week '+week.n+' '+week.range+' '+lines.join(' ')).toLocaleLowerCase();
    const titleHit=('Week '+week.n+' '+week.phase).toLocaleLowerCase().includes(query);
    const matchingLines=lines.filter(line=>terms.every(term=>line.toLocaleLowerCase().includes(term)));
    const hit=terms.every(term=>haystack.includes(term));
    return {type:'curriculum',item:week,titleHit,matchingLines,hit};
  }).filter(m=>m.titleHit||m.hit);

  const matches=[...skillMatches,...drillMatches,...curriculumMatches]
    .sort((a,b)=>Number(b.titleHit)-Number(a.titleHit)||b.matchingLines.length-a.matchingLines.length||a.item.n-b.item.n);

  const status=document.createElement('div');
  status.className='search-status';
  status.textContent=matches.length ? `${matches.length} matching result${matches.length===1?'':'s'}` : 'No matches';
  searchResults.appendChild(status);

  matches.forEach(({type,item,matchingLines})=>{
    const button=document.createElement('button');
    button.type='button';
    if(type==='skill'){
      button.dataset.go=item.n;
      button.textContent=`Skill Tree ${item.n}: ${item.title}`;
      button.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        show(item.n,true);
        searchInput.value='';
        updateSearch();
      });
    }else if(type==='drill'){
      button.dataset.drill=item.n;
      button.textContent=`Drill Level ${item.n}: ${item.title}`;
      button.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        showDrill(item.n,true);
        searchInput.value='';
        updateSearch();
      });
    }else{
      button.dataset.week=item.n;
      button.textContent=`Curriculum Week ${item.n}: ${item.phase}`;
      button.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        showCurriculum(item.n,true);
        searchInput.value='';
        updateSearch();
      });
    }
    if(matchingLines.length){
      const detail=document.createElement('small');
      detail.textContent=matchingLines.slice(0,2).join(' · ');
      button.appendChild(detail);
    }
    searchResults.appendChild(button);
  });
}
searchInput.addEventListener('input',updateSearch);
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const first=searchResults.querySelector('button[data-go], button[data-drill], button[data-week]');
    if(first){e.preventDefault();first.click()}
  }
  if(e.key==='Escape'){searchInput.value='';updateSearch()}
});

creasing speed.","Short competitive stations."],["Rehearse each wrestler’s currently best Double Leg, Single Leg, or High Crotch setup and finish.","Defender gives moderate resistance; wrestler identifies which attack remains reliable and which needs work.","Neutral score-first rounds."],["Stand-Up plus preferred top turn: Half Nelson, Cradle, or Tilt; clean repetitions.","Start randomly top or bottom; wrestler immediately uses the chosen first action and then wrestles live.","Mixed-position king-of-the-mat style rounds."]],[["Single Leg finishing positions from mat and standing; head position, corner, shelf, and cover.","Defender establishes Whizzer/Shin-Whizzer pressure; attacker keeps leg control and works to a finish or safe transition.","Single-leg live from mat and standing."],["High Crotch → Crackdown; teach Shelf Leg first, then Cartwheel / trap-arm roll / head-hunt options as appropriate.","Defender sprawls and squares; attacker identifies the Crackdown position and selects the appropriate finish.","Start directly in Crackdown and wrestle to score."],["Shot Recovery → reattack: stopped shot becomes corner, Front Headlock, Crackdown, or second attack.","Partner varies shot defense; attacker must keep wrestling continuously through the failed first attempt.","Continuous neutral rounds with no reset after the first defended shot."]],[["Arm Bar entry, secure position, run bar, and maintain pressure; review Half Nelson.","Bottom stays flat or begins to build; top follows the reaction and keeps control while choosing the finish.","Arm-Bar turn-or-escape rounds."],["Bottom vs Arm Bar and Bottom vs Half Nelson: clear danger, recover elbow/arm, rebuild base.","Top starts with partial control; bottom must first become safe, then rebuild and escape rather than rushing directly to feet.","Begin in bad positions and wrestle to escape."],["Top chooses Tight Waist, Spiral, Half Nelson, or Arm Bar; bottom uses Stand-Up/Tripod.","First attack or escape is stopped; both wrestlers immediately chain to their backup action.","30–45 second referee’s-position live rounds."]],[["Neutral chain: Collar Tie / Wrist Control / Underhook → primary attack → backup attack.","Partner stops the first attack or changes tie position; wrestler immediately moves to the second attack.","Neutral tie-up live with emphasis on two-action chains."],["Top chain: Tight Waist or Spiral → Turn A → Turn B.","Bottom blocks the first turn; top maintains pressure and transitions without returning to the start.","Top stays live through the first failed turn."],["Bottom chain: Stand-Up → Tripod / secondary escape; maintain hand control throughout.","Top blocks the first escape; bottom immediately moves to the backup escape rather than returning to base and waiting.","Referee’s-position live with ride-out scoring."]],[["Misdirection: fake shot, fake snapdown, or throw threat → second attack.","Partner reacts honestly to the fake; wrestler attacks the opening created by that reaction.","Neutral rounds where scoring must follow a setup or reaction."],["Scramble basics: head higher, protect hips, control a leg, pass/shelf leg, Merkle awareness.","Start in a controlled 50/50 position; wrestlers apply the scramble priorities instead of chasing random movement.","Controlled scramble starts."],["Attack → defense → reattack; blend Shot Recovery, Front Headlock, and Scramble.","Partner changes defense continuously; attacker must keep wrestling through transitions for the full interval.","45-second continuous wrestling bursts."]],[["Leg-Riding entry from Spiral, flattening pressure, wrist control, and basic turn awareness.","Bottom changes base and elbow position; top decides whether to stay with legs, attack a turn, or return to core ride pressure.","Leg-ride positional live."],["Bottom vs Leg Ride: opposite shoulder up, swim arm, build hips, sit-out/tripod to clear hook.","Top follows with moderate pressure; bottom chains clearing actions until the hook is removed and position is recovered.","Bottom starts with leg already in."],["Personal top system: Tight Waist, Spiral, or Legs In based on athlete strength.","Bottom gives different reactions; top chooses the system that produces control rather than forcing a preferred move.","Choice-based top/bottom live with near-fall scoring."]],[["Neutral A-game: primary setup → primary attack → backup attack; high-quality repetitions.","Partner gives the most common defense to the primary attack; wrestler executes the predetermined backup.","Match-like neutral rounds scored by successful A-game execution."],["Top A-game: primary breakdown → Turn A → Turn B.","Bottom blocks Turn A; top maintains control and immediately transitions to Turn B.","Top must score near-fall or ride out from referee’s position."],["Bottom A-game: first escape → backup escape; Stand-Up remains the default first option.","Top stops the first escape; bottom uses the designated backup without hesitation.","Bottom must escape under scoreboard pressure."]],[["Throws by tie: safe entries from Underhook, Over-Under, Body Lock, Front Headlock, and Russian 2-on-1.","Partner changes tie position; wrestler uses a throw only when the correct tie/reaction exists, otherwise returns to primary offense.","Controlled throw-entry positional wrestling."],["Personal chain: A-game neutral attack → Takedown → Top Transition → preferred turn.","Defender gives realistic resistance through the entire sequence; attacker stays connected after the takedown.","Start neutral and continue through score and top control."],["Full-system review through short matches; coach corrects decisions rather than adding new moves.","Between rounds, wrestler identifies where the chain broke and rehearses that transition once before returning live.","High live volume with full scoring."]],[["Neutral A-game speed reps; rehearse score-first and defend-the-lead situations.","Coach gives time/score and opponent position; wrestler chooses attack, reattack, or controlled defense based on situation.","Short high-intensity score-first situations."],["Ride, escape, turn situations: 30 seconds left up one/down one; need escape; need turn; ride-out.","Coach changes score and clock; wrestler must immediately identify the correct objective before wrestling.","Scoreboard-driven positional live."],["Full match simulation including warm-up, between-period choice, and overtime-style situations.","Coach provides short corrections between bouts; no new technique is introduced.","Mostly live wrestling with match pacing and recovery."]],[["A-game checklist: primary setup, takedown, backup attack, shot recovery, breakdown, two turns, first/second escape.","Partner gives championship-level but controlled resistance; wrestler uses only established techniques.","Moderate live; stop before fatigue changes technique."],["Championship situations: 30 seconds down one/up one, need escape, need takedown, opponent has your leg, Front Headlock, ride-out.","Coach calls situations randomly; wrestler responds immediately using the established system.","Short intense situational rounds with full recovery."],["Perfect reps only: movement → hand fight → 5–10 primary attacks → escapes → breakdowns → turns.","No new reaction chains; correct only major errors and preserve confidence/speed.","Very short competition-speed bursts; taper conditioning and finish fresh."]]];

const treeAliases = [
  ['Front-Headlock Tree',12],['Front Headlock',12],
  ['Single-Leg Tree',10],['Single Leg',10],['Head-Inside Single',10],['Sweep Single',10],
  ['Russian / 2-on-1 Tree',6],['Russian 2-on-1',6],['Russian tie',6],['2-on-1',6],
  ['Leg-Riding Tree',22],['Leg Ride',22],['Legs In',22],['Legs in',22],
  ['Arm-Bar Tree',19],['Arm Bar',19],['Arm bar',19],['Rebar',19],
  ['Cradle Tree',21],['Cradle',21],['Tilt Tree',18],['Tilts',18],['Tilt',18],
  ['Half-Nelson Tree',20],['Half Nelson',20],['Half-Nelson',20],
  ['Wrist-Control Tree',4],['Wrist Control',4],['Underhook Tree',5],['Underhook',5],
  ['Scramble',28],['Merkle',28],['Spladle',28],
  ['Double Leg',8],['Double-Leg',8],['High Crotch',9],['High-Crotch',9],
  ['Low Single',11],['Low-Single',11],['Tight Waist',16],['Tight-waist',16],['Tight waist',16],
  ['Spiral Ride',17],['Spiral ride',17],['Spiral',17],['Collar Tie',2],['Collar tie',2],
  ['Shot Recovery',7],['Neutral Defense',13],['Peterson',23],
  ['Cow Catcher',31],['Pancake',31],['Lateral Drop',31],['Hip Toss',31],['Body Lock',31],['Osoto Gari',31],['Uchi Mata',31]
].sort((a,b)=>b[0].length-a[0].length);

function linkTreeKeywords(text,currentTree=null){
  let out=String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const placeholders=[];
  for(const [label,n] of treeAliases){
    const esc=label.replace(/[.*+?^$()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp(esc,'gi'),match=>{
      const token='@@TREE_LINK_'+placeholders.length+'@@';
      placeholders.push(Number(currentTree)===Number(n)
        ? match
        : '<a href="#section-'+n+'" data-go="'+n+'">'+match+'</a>');
      return token;
    });
  }
  placeholders.forEach((html,i)=>{out=out.replace('@@TREE_LINK_'+i+'@@',html)});
  return out;
}
function addTreeLinks(text,currentTree=null){
  return text.split('\n').map(line=>{
    if(line==='') return '<span class="tree-line">&nbsp;</span>';
    const m=line.match(/^([\s│├└─]*)(.*)$/);
    const prefix=m?m[1]:'';
    const body=m?m[2]:line;
    return `<span class="tree-line"><span class="tree-prefix">${prefix}</span><span class="tree-text">${linkTreeKeywords(body,currentTree)}</span></span>`;
  }).join('');
}

function isMobileLayout(){
  return window.matchMedia('(max-width:800px)').matches;
}
function revealTarget(target){
  if(!target) return;
  target.classList.add('active');
  target.scrollIntoView({behavior:'smooth',block:'start'});
}

function setCurrentSelection(label){
  if(currentSelection) currentSelection.textContent='Current: '+label;
}

function show(n,push=false){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-n]').forEach(x=>x.classList.toggle('active',Number(x.dataset.n)===n));
  document.querySelectorAll('nav button[data-drill]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-week], nav button[data-curriculum]').forEach(x=>x.classList.remove('active'));
  skillMenu.classList.add('open');
  skillMenuButton.setAttribute('aria-expanded','true');
  setCurrentSelection(`${n}. ${byNum[n].title}`);
  const target=document.getElementById(`section-${n}`);
  if(target){revealTarget(target);if(push)history.pushState(null,'',`#section-${n}`)}
}

function showDrill(n,push=false){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-n]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-week], nav button[data-curriculum]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-drill]').forEach(x=>x.classList.toggle('active',Number(x.dataset.drill)===n));
  drillMenu.classList.add('open');
  drillMenuButton.setAttribute('aria-expanded','true');
  setCurrentSelection(`Drill Level ${n} — ${drillLevels.find(x=>x.n===n)?.title || ''}`);
  const target=document.getElementById(`drill-level-${n}`);
  if(target){revealTarget(target);if(push)history.pushState(null,'',`#drill-level-${n}`)}
}

function showCurriculum(n,push=false){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-n], nav button[data-drill], nav button[data-week], nav button[data-curriculum]').forEach(x=>x.classList.remove('active'));
  curriculumMenu.classList.add('open');
  curriculumMenuButton.setAttribute('aria-expanded','true');
  const isCore=n==='core';
  if(isCore) coreButton.classList.add('active');
  else document.querySelectorAll('nav button[data-week]').forEach(x=>x.classList.toggle('active',Number(x.dataset.week)===Number(n)));
  setCurrentSelection(isCore ? 'Core 6 — Foundation System' : `Curriculum Week ${n} — ${curriculumWeeks.find(x=>x.n===Number(n))?.range || ''}`);
  const target=document.getElementById(isCore?'curriculum-core':`curriculum-week-${n}`);
  if(target){
    revealTarget(target);
    if(push) history.pushState(null,'',isCore?'#curriculum-core':`#curriculum-week-${n}`);
  }
}

document.addEventListener('click',e=>{
  const core=e.target.closest('[data-curriculum]');
  if(core){e.preventDefault();showCurriculum('core',true);return}
  const week=e.target.closest('[data-week]');
  if(week){e.preventDefault();showCurriculum(Number(week.dataset.week),true);return}
  const drill=e.target.closest('[data-drill]');
  if(drill){e.preventDefault();showDrill(Number(drill.dataset.drill),true);return}
  const a=e.target.closest('[data-go]');
  if(a){e.preventDefault();show(Number(a.dataset.go),true)}
});
window.addEventListener('popstate',()=>{
  if(location.hash==='#curriculum-core'){showCurriculum('core',false);return}
  const w=location.hash.match(/curriculum-week-(\d+)/);
  if(w){showCurriculum(Number(w[1]),false);return}
  const d=location.hash.match(/drill-level-(\d+)/);
  if(d){showDrill(Number(d[1]),false);return}
  const m=location.hash.match(/section-(\d+)/);
  show(m?Number(m[1]):1,false);
});
const initialWeek=location.hash.match(/curriculum-week-(\d+)/);
const initialDrill=location.hash.match(/drill-level-(\d+)/);
const initial=location.hash.match(/section-(\d+)/);
if(location.hash==='#curriculum-core')showCurriculum('core',false);
else if(initialWeek)showCurriculum(Number(initialWeek[1]),false);
else if(initialDrill)showDrill(Number(initialDrill[1]),false);
else show(initial?Number(initial[1]):1,false);
</script>
