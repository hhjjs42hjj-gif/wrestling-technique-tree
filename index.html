.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 76px)}
nav{border-right:1px solid var(--line);padding:16px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;background:var(--panel)}

nav button:hover,nav button.active{background:var(--panel2);border-color:var(--line)}
.search-area{margin:0 0 16px;grid-column:1/-1}
.search-area label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
#tree-search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}

main{padding:24px;max-width:1200px;width:100%}
.section{display:none;scroll-margin-top:88px}.section.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.16)}

.badge{display:inline-block;font-size:12px;padding:3px 7px;border-radius:999px;background:#17314f;color:#b9dcff;margin-left:8px;vertical-align:middle}
.coach{margin-top:14px;padding:12px 14px;border-left:3px solid var(--good);background:#101820;color:#d9e8df;border-radius:8px}

.nav-group{margin:4px 0 12px;border:1px solid var(--line);border-radius:10px;background:#111821;overflow:hidden}
.nav-group>button{margin:0;border:0;border-radius:0;font-weight:700}
.nav-group>button::after{content:'▸';float:right;color:var(--muted);transition:transform .18s ease}
.nav-group.open>button::after{transform:rotate(90deg)}
.nav-submenu{display:none;padding:5px 7px 7px;border-top:1px solid var(--line);background:var(--bg)}
.nav-group.open .nav-submenu{display:block}
.nav-submenu button{font-size:12.5px;padding:7px 8px;margin-bottom:3px}
.coach-focus{margin:5px 0 9px;padding:11px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:12px;line-height:1.45;color:var(--muted)}
.coach-focus strong{color:var(--text)}
.coach-focus .focus-title{color:var(--good);font-weight:800;font-size:12.5px;margin-bottom:6px}
.coach-focus .focus-order{color:var(--text);margin-bottom:7px}
.drill-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}

.drill-table th{background:var(--panel2)}
.drill-table td:first-child{font-weight:650;width:25%}
.drill-table td:nth-child(2){width:40%}
.drill-note{margin:14px 0 0;padding:12px 14px;border-left:3px solid var(--accent);background:#101820;border-radius:8px;color:#d7e8fa}
.drill-kicker{color:var(--accent);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
@media(max-width:800px){.nav-group{grid-column:1/-1}.nav-submenu{grid-template-columns:1fr 1fr}.drill-table{display:block;overflow-x:auto}.drill-table th,.drill-table td{min-width:160px}}

@media(max-width:800px){.layout{grid-template-columns:1fr}nav{position:relative;top:auto;height:auto;border-right:none;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}nav h2{grid-column:1/-1}nav button{margin:0}main{padding:14px}.section h2{font-size:23px}}
</style>

function updateSearch(){
  const query=searchInput.value.trim().toLocaleLowerCase();
  searchResults.replaceChildren();
  if(!query)return;
  const terms=query.split(/\s+/);

  const skillMatches=sections.map(s=>{
    const lines=s.tree.split('\n').map(line=>line.replace(/^[\s│├└─]+/g,'').trim()).filter(Boolean);
    const haystack=(s.title+' '+s.tree).toLocaleLowerCase();
    const titleHit=s.title.toLocaleLowerCase().includes(query);
    const matchingLines=lines.filter(line=>terms.every(term=>line.toLocaleLowerCase().includes(term)));
    const hit=terms.every(term=>haystack.includes(term));
    return {type:'skill',item:s,titleHit,matchingLines,hit};
  }).filter(m=>m.titleHit||m.hit);

  const drillMatches=drillLevels.map(level=>{
    const lines=level.rows.flatMap(r=>r).map(String);
    const haystack=(level.title+' '+lines.join(' ')+' '+(level.group||'')+' '+(level.note||'')).toLocaleLowerCase();
    const titleHit=(`Level ${level.n} ${level.title}`).toLocaleLowerCase().includes(query);
    const matchingLines=lines.filter(line=>terms.every(term=>line.toLocaleLowerCase().includes(term)));
    const hit=terms.every(term=>haystack.includes(term));
    return {type:'drill',item:level,titleHit,matchingLines,hit};
  }).filter(m=>m.titleHit||m.hit);

  const matches=[...skillMatches,...drillMatches]
    .sort((a,b)=>Number(b.titleHit)-Number(a.titleHit)||b.matchingLines.length-a.matchingLines.length||a.item.n-b.item.n);

  const status=document.createElement('div');
  status.className='search-status';
  status.textContent=matches.length ? `${matches.length} matching result${matches.length===1?'':'s'}` : 'No matches';
  searchResults.appendChild(status);

  matches.forEach(({type,item,matchingLines})=>{
    const button=document.createElement('button');
    button.type='button';
    if(type==='skill'){
      button.dataset.go=item.n;
      button.textContent=`Skill Tree ${item.n}: ${item.title}`;
      button.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        show(item.n,true);
        searchInput.value='';
        updateSearch();
      });
    }else{
      button.dataset.drill=item.n;
      button.textContent=`Drill Level ${item.n}: ${item.title}`;
      button.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        showDrill(item.n,true);
        searchInput.value='';
        updateSearch();
      });
    }
    if(matchingLines.length){
      const detail=document.createElement('small');
      detail.textContent=matchingLines.slice(0,2).join(' · ');
      button.appendChild(detail);
    }
    searchResults.appendChild(button);
  });
}
searchInput.addEventListener('input',updateSearch);
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const first=searchResults.querySelector('button[data-go], button[data-drill]');
    if(first){e.preventDefault();first.click()}
  }
  if(e.key==='Escape'){searchInput.value='';updateSearch()}
});

function linkTreeKeywords(text){
  let out=String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const placeholders=[];
  for(const [label,n] of treeAliases){
    const esc=label.replace(/[.*+?^$()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp(esc,'gi'),match=>{
      const token='@@TREE_LINK_'+placeholders.length+'@@';
      placeholders.push('<a href="#section-'+n+'" data-go="'+n+'">'+match+'</a>');
      return token;
    });
  }
  placeholders.forEach((html,i)=>{out=out.replace('@@TREE_LINK_'+i+'@@',html)});
  return out;
}
function addTreeLinks(text){
  return text.split('\n').map(line=>{
    if(line==='') return '<span class="tree-line">&nbsp;</span>';
    const m=line.match(/^([\s│├└─]*)(.*)$/);
    const prefix=m?m[1]:'';
    const body=m?m[2]:line;
    return `<span class="tree-line"><span class="tree-prefix">${prefix}</span><span class="tree-text">${linkTreeKeywords(body)}</span></span>`;
  }).join('');
}

const skillMenu=document.createElement('div');
skillMenu.className='nav-group open';
const skillMenuButton=document.createElement('button');
skillMenuButton.type='button';
skillMenuButton.textContent='Skill Trees';
skillMenuButton.setAttribute('aria-expanded','true');
const skillSubmenu=document.createElement('div');
skillSubmenu.className='nav-submenu';
skillMenuButton.addEventListener('click',()=>{
  const open=skillMenu.classList.toggle('open');
  skillMenuButton.setAttribute('aria-expanded',String(open));
});
skillMenu.append(skillMenuButton,skillSubmenu);
nav.appendChild(skillMenu);

const drillMenu=document.createElement('div');
drillMenu.className='nav-group';
const drillMenuButton=document.createElement('button');
drillMenuButton.type='button';
drillMenuButton.textContent='Drills and Progressions';
drillMenuButton.setAttribute('aria-expanded','false');
const drillSubmenu=document.createElement('div');
drillSubmenu.className='nav-submenu';
const coachFocus=document.createElement('div');
coachFocus.className='coach-focus';
coachFocus.innerHTML=`<div class="focus-title">Coach Focus — Full Development Order</div>
<div class="focus-order"><strong>Mobility/body control → stance &amp; footwork → neutral defense → basic attacks → hand fighting → bottom → top → turns/pins → recognition/reaction drills → neutral positional live → single-leg live → referee's-position live → pin survival → scrambling.</strong></div>
<div><strong>Practice planning:</strong> warm up with Level 1–2 movements, teach/review from Levels 3–10, and finish with positional wrestling from Levels 11–15.</div>
<div style="margin-top:7px">For elementary and middle-school groups, <strong>do not wait</strong> until wrestlers have “mastered” Levels 1–10 before doing positional live. The levels describe <strong>complexity</strong>, not a months-long curriculum. Even beginners can do simple 15–30-second positional rounds very early; choose positions appropriate to what they've learned.</div>`;
drillSubmenu.appendChild(coachFocus);
drillLevels.forEach(level=>{
  const button=document.createElement('button');
  button.type='button';
  button.dataset.drill=level.n;
  button.textContent=`Level ${level.n} — ${level.title}`;
  drillSubmenu.appendChild(button);
});
drillMenuButton.addEventListener('click',()=>{
  const open=drillMenu.classList.toggle('open');
  drillMenuButton.setAttribute('aria-expanded',String(open));
});
drillMenu.append(drillMenuButton,drillSubmenu);
nav.appendChild(drillMenu);

drillLevels.forEach(level=>{
  const sec=document.createElement('section');
  sec.className='section drill-section';
  sec.id=`drill-level-${level.n}`;
  const rows=level.rows.map(r=>`<tr><td>${linkTreeKeywords(r[0])}</td><td>${linkTreeKeywords(r[1])}</td><td>${linkTreeKeywords(r[2])}</td></tr>`).join('');
  sec.innerHTML=`<div class="card">
    ${level.group?`<div class="drill-kicker">${level.group}</div>`:''}
    <h2>Level ${level.n} — ${level.title}</h2>
    <div class="sub">Drill progression: what the wrestler does and the wrestling purpose behind it.</div>
    <table class="drill-table">
      <thead><tr><th>Drill / starting position</th><th>What they're doing</th><th>Wrestling purpose</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${level.note?`<div class="drill-note">${level.note}</div>`:''}
  </div>`;
  main.appendChild(sec);
});

sections.forEach((s,i)=>{
  const b=document.createElement('button');
  b.textContent=`${s.n}. ${s.title}`;
  b.dataset.n=s.n;
  b.onclick=()=>show(s.n,true);
  skillSubmenu.appendChild(b);

  const sec=document.createElement('section');
  sec.className='section'+(i===0?' active':'');
  sec.id=`section-${s.n}`;
  const refLinks=(s.refs||[]).map(n=>`<a href="#section-${n}" data-go="${n}">${n}. ${byNum[n].title}</a>`).join('');
  sec.innerHTML=`<div class="card">
    <h2>${s.n}. ${s.title}${s.badge?`<span class="badge">${s.badge}</span>`:''}</h2>
    <div class="sub">Click any linked tree reference to jump to that related section.</div>
    <div class="tree">${addTreeLinks(s.tree)}</div>
    ${s.coach?`<div class="coach">${s.coach}</div>`:''}
    ${refLinks?`<div class="links"><strong>Related trees:</strong><br>${refLinks}</div>`:''}
  </div>`;
  main.appendChild(sec);
});

function show(n,push=false){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-n]').forEach(x=>x.classList.toggle('active',Number(x.dataset.n)===n));
  document.querySelectorAll('nav button[data-drill]').forEach(x=>x.classList.remove('active'));
  skillMenu.classList.add('open');
  skillMenuButton.setAttribute('aria-expanded','true');
  const target=document.getElementById(`section-${n}`);
  if(target){target.classList.add('active');target.scrollIntoView({behavior:'smooth',block:'start'});if(push)history.pushState(null,'',`#section-${n}`)}
}

function showDrill(n,push=false){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-n]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-drill]').forEach(x=>x.classList.toggle('active',Number(x.dataset.drill)===n));
  drillMenu.classList.add('open');
  drillMenuButton.setAttribute('aria-expanded','true');
  const target=document.getElementById(`drill-level-${n}`);
  if(target){target.classList.add('active');target.scrollIntoView({behavior:'smooth',block:'start'});if(push)history.pushState(null,'',`#drill-level-${n}`)}
}

document.addEventListener('click',e=>{
  const drill=e.target.closest('[data-drill]');
  if(drill){e.preventDefault();showDrill(Number(drill.dataset.drill),true);return}
  const a=e.target.closest('[data-go]');
  if(a){e.preventDefault();show(Number(a.dataset.go),true)}
});
window.addEventListener('popstate',()=>{
  const d=location.hash.match(/drill-level-(\d+)/);
  if(d){showDrill(Number(d[1]),false);return}
  const m=location.hash.match(/section-(\d+)/);
  show(m?Number(m[1]):1,false);
});
const initialDrill=location.hash.match(/drill-level-(\d+)/);
const initial=location.hash.match(/section-(\d+)/);
if(initialDrill)showDrill(Number(initialDrill[1]),false);else show(initial?Number(initial[1]):1,false);
</script>
